[project]
name = "rh-agentic-sentinel"
version = "0.1.0"
description = "Read-only Robinhood portfolio risk and catalyst sentinel"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "uvicorn>=0.32.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
